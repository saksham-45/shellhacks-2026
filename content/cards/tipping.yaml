title:
  es: La propina
  en: Tipping
  ht: Poubwa
summary:
  es: En un restaurante con servicio a la mesa, la propina es parte del precio, porque el sueldo cuenta con ella.
  en: At a sit-down meal the tip is part of the price, because the wage assumes it.
  ht: Nan yon restoran kote yo sèvi w sou tab, poubwa a fè pati pri a, paske salè a konte sou li.
body:
  es: |-
    En tu país, el precio del menú puede ser el precio completo.

    Aquí, en un restaurante con servicio a la mesa, se suele dejar {fact:us.tipping.sit-down-range} de la cuenta.

    Revisa la cuenta primero. Algunos lugares ya incluyen un cargo por servicio.

    Lo que cuesta: no dejar propina se entiende como que el servicio fue malo.
  en: |-
    At home, the price on the menu may be the whole price.

    Here, people usually tip {fact:us.tipping.sit-down-range} of the bill at a sit-down restaurant.

    Check the bill first. Some places already add a service charge.

    What it costs: skipping the tip reads as saying the service was bad.
  ht: |-
    Lakay, pri ki sou meni an ka tout pri a.

    Isit la, nan yon restoran ak sèvis sou tab, moun konn bay {fact:us.tipping.sit-down-range} nan bòdwo a.

    Tcheke bòdwo a an premye. Gen kote ki deja mete yon frè sèvis.

    Sa sa koute: si ou pa bay poubwa, yo konprann ou di sèvis la te move.
