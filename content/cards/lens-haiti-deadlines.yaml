title:
  es: Fechas límite, en criollo haitiano
  en: Deadlines, in Creole
  ht: Dat limit, an kreyòl
summary:
  es: 'Criollo haitiano en cada botón. El correo en inglés y las fechas del permiso de trabajo requieren una revisión acreditada. El estado de cada haitiano depende de sus propios papeles.'
  en: 'Creole on every button. Mail is in English, and work card dates need accredited review. Each Haitian person’s status depends on their own papers.'
  ht: 'Kreyòl sou chak bouton. Lèt yo an anglè, epi dat sou pèmi travay bezwen revizyon akredite. Estati chak Ayisyen depann de pwòp papye li.'
body:
  es: |-
    Idiomas en que contesta la línea del condado para lo que no es emergencia: {fact:us-fl-miamidade.311.languages}.

    El estado de cada haitiano depende de sus propios papeles; habla con una persona acreditada antes de actuar por algo que hayas oído.

    Una fecha límite entra en tu calendario solo cuando la fuente oficial la confirma.

    Abre cada carta de USCIS el día que llega. Un notario no puede aconsejarte sobre tus papeles.
  en: |-
    Languages the county non-emergency desk answers in: {fact:us-fl-miamidade.311.languages}.

    Each Haitian person’s status depends on their own papers; talk to an accredited helper before acting on anything you heard.

    A deadline goes on your calendar only when the official source confirms it.

    Open every letter from USCIS the day it comes. A notary cannot advise you on your papers.
  ht: |-
    Lang liy konte a pou sa ki pa ijans reponn: {fact:us-fl-miamidade.311.languages}.

    Estati chak Ayisyen depann de pwòp papye li; pale ak yon moun akredite anvan ou aji sou yon bagay ou tande.

    Yon dat limit antre nan kalandriye ou sèlman lè sous ofisyèl la konfime l.

    Louvri chak lèt USCIS jou li rive a. Yon notè pa ka konseye w sou papye ou.
