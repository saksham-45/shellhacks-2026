title:
  es: Salir de MIA
  en: Leaving MIA
  ht: Soti nan ayewopò MIA
summary:
  es: Toma un taxi oficial o ve al punto de recogida de las apps. La persona que se acerca ofreciendo una oferta es la primera estafa.
  en: Take an official taxi or go to the rideshare pickup. The person who walks up offering a deal is the first scam.
  ht: Pran yon taksi ofisyèl oswa ale kote aplikasyon woulib yo ranmase moun. Moun ki vin jwenn ou ak yon 'bon pri' se premye eskwokri a.
body:
  es: |-
    MIA tiene paradas oficiales de taxi y zonas marcadas para recoger pasajeros de apps.

    Un chofer que se te acerca dentro de la terminal no es la fila oficial.

    Pregunta la tarifa, o mira el precio en la app, antes de que el carro arranque.

    Lo que cuesta: los taxis de MIA cobran por taxímetro en todos los viajes, más un cargo del aeropuerto, con una tarifa mínima desde MIA; ya no hay tarifas fijas.
    Un chofer no oficial puede cobrar lo que quiera, y no hay a quién reclamarle.

    ¿Perdido o con dudas? Ve a un mostrador de información del aeropuerto.
  en: |-
    MIA has official taxi stands and marked rideshare pickup zones.

    A driver who walks up to you inside the terminal is not the official line.

    Ask the fare, or check the price in the app, before the car moves.

    What it costs: taxis from MIA run the meter on every trip, plus an airport fee, with a minimum fare from MIA; there are no flat fares anymore.
    An unofficial driver can charge what they want, and there is no one to complain to.

    Lost or unsure? Go to an airport information counter.
  ht: |-
    MIA gen kote ofisyèl pou taksi ak zòn ki make pou aplikasyon woulib yo ranmase moun.

    Yon chofè ki vin jwenn ou anndan tèminal la pa liy ofisyèl la.

    Mande pri a, oswa gade pri a nan aplikasyon an, anvan machin nan demare.

    Sa sa koute: taksi ki soti MIA yo mache ak kontè pou tout vwayaj, plis yon frè ayewopò, ak yon pri minimòm depi MIA; pa gen pri fiks ankò.
    Yon chofè ki pa ofisyèl ka mande sa l vle, epi pa gen moun pou w plenyen bay.

    Ou pèdi oswa ou pa sèten? Ale nan yon kontwa enfòmasyon ayewopò a.
