title:
  es: Una factura médica
  en: A medical bill
  ht: Yon bòdwo medikal
summary:
  es: A qué oficina llamar y qué preguntar antes y después de la visita. No adivinamos tu cobertura.
  en: Which desk to call and what to ask before and after the visit. We do not guess your coverage.
  ht: Ki biwo pou rele ak kisa pou mande anvan ak apre vizit la. Nou pa devine kouvèti ou.
body:
  es: |-
    Antes de una visita planeada, pregunta: ¿cuánto voy a pagar y hay precio en efectivo?

    En Florida, puedes pedirle al hospital una factura detallada.

    Los proveedores de salud que reciben dinero federal deben tomar medidas razonables para darte acceso real en tu idioma.

    La ayuda financiera de Jackson puede cubrir hogares hasta {fact:us-fl-miamidade.jackson.financial-assistance.sliding-scale-max-fpl} de las pautas federales de pobreza; pregunta antes de pagar la cuenta.

    La renovación de Jackson Prime es solo en línea: {fact:us-fl-miamidade.jackson.prime-renewal-online-only}; pregunta en la oficina de Jackson si necesitas ayuda.

    Pregunta en facturación: ¿hay plan de pagos, y pueden detener la cuenta mientras pido ayuda?

    No sabemos tu cobertura. La sabe tu aseguradora o la oficina de facturación.
  en: |-
    Before a planned visit, ask: what will I pay, and is there a cash price?

    In Florida, you can ask the hospital for an itemized bill.

    Health providers that take federal money must take reasonable steps to give you meaningful access in your language.

    Jackson's financial help can cover households up to {fact:us-fl-miamidade.jackson.financial-assistance.sliding-scale-max-fpl} of the federal poverty guidelines; ask before you pay the bill.

    Jackson Prime renewal is online only: {fact:us-fl-miamidade.jackson.prime-renewal-online-only}; ask the Jackson desk if you need help.

    Ask the billing office: is there a payment plan, and can you hold the bill while I apply for help?

    We do not know your coverage. Your insurer or the billing office does.
  ht: |-
    Anvan yon vizit ki planifye, mande: konbyen m ap peye, epi èske gen yon pri kach?

    Nan Florid, ou ka mande lopital la yon bòdwo detaye.

    Founisè swen sante ki resevwa lajan federal dwe pran mezi rezonab pou ba ou aksè toutbon nan lang ou.

    Èd finansyè Jackson ka kouvri kay ki rive jiska {fact:us-fl-miamidade.jackson.financial-assistance.sliding-scale-max-fpl} nan direktiv federal sou povrete; mande anvan ou peye bòdwo a.

    Renouvèlman Jackson Prime fèt sou entènèt sèlman: {fact:us-fl-miamidade.jackson.prime-renewal-online-only}; mande biwo Jackson nan si ou bezwen èd.

    Mande biwo fakti a: èske gen yon plan peman, epi èske yo ka kenbe bòdwo a pandan m ap mande èd?

    Nou pa konnen kouvèti ou. Se asirans ou oswa biwo fakti a ki konnen.
