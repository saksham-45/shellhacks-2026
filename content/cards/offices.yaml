title:
  es: Qué oficina se encarga de qué
  en: Which office owns what
  ht: Ki biwo ki okipe kisa
summary:
  es: Emergencias, la oficina del condado, la licencia, los papeles federales. La ciudad y el condado son gobiernos distintos, y tu dirección sabe cuál.
  en: Emergency, the county desk, the license, federal papers. The city and the county are different governments, and your pin knows which one.
  ht: Ijans, biwo konte a, lisans, papye federal. Vil la ak konte a se de gouvènman diferan, epi adrès ou konnen kiyès.
body:
  es: |-
    {fact:us.911.phone} es policía, bomberos y ambulancia, para una emergencia ahora.

    {fact:us-fl-miamidade.311.phone} es la línea del condado para lo que no es emergencia: basura que no pasó, un bache, una pregunta.

    El Tax Collector se encarga de la licencia de manejar y de la placa del carro.

    USCIS es la oficina federal de los papeles de inmigración.

    Vives en {fact:us-fl-miamidade.gov.municipality}. La ciudad y el condado son gobiernos separados.
  en: |-
    {fact:us.911.phone} is police, fire, and ambulance, for an emergency now.

    {fact:us-fl-miamidade.311.phone} is the county's non-emergency desk: a missed pickup, a pothole, a question.

    The Tax Collector handles the driver license and the car tag.

    USCIS is the federal office for immigration papers.

    You live in {fact:us-fl-miamidade.gov.municipality}. The city and the county are separate governments.
  ht: |-
    {fact:us.911.phone} se lapolis, ponpye, ak anbilans, pou yon ijans kounye a.

    {fact:us-fl-miamidade.311.phone} se liy konte a pou sa ki pa ijans: fatra yo pa ranmase, yon twou nan wout, yon kesyon.

    Tax Collector la okipe lisans kondwi ak plak machin.

    USCIS se biwo federal pou papye imigrasyon.

    Ou rete nan {fact:us-fl-miamidade.gov.municipality}. Vil la ak konte a se gouvènman separe.
