title:
  es: Alcohol, cigarrillo y sobornos
  en: Alcohol, smoking, and bribes
  ht: Alkòl, sigarèt, ak koripsyon
summary:
  es: La edad para tomar alcohol es {fact:us.alcohol.minimum-age}. Las reglas de fumar están en los letreros. Un soborno aquí es un delito, no una tarifa.
  en: The drinking age is {fact:us.alcohol.minimum-age}. Smoking rules are posted. A bribe is a crime here, not a fee.
  ht: Laj pou bwè alkòl se {fact:us.alcohol.minimum-age}. Règ pou fimen yo afiche. Koripsyon isit la se yon krim, se pa yon frè.
body:
  es: |-
    En tu país, la edad para tomar puede ser más flexible, y un pago pequeño puede arreglar las cosas.

    Aquí, las tiendas y bares piden identificación, y ofrecerle dinero a un funcionario es un delito.

    Sigue el letrero de fumar de la puerta.
  en: |-
    At home, the rules on drinking age may be looser, and a small payment may smooth things over.

    Here, stores and bars check ID, and offering money to an official is a crime.

    Follow the smoking sign on the door.
  ht: |-
    Lakay, règ sou laj pou bwè ka pi lach, epi yon ti kòb ka ranje bagay yo.

    Isit la, magazen ak ba mande ID, epi ofri yon otorite lajan se yon krim.

    Swiv siy fimen ki sou pòt la.
