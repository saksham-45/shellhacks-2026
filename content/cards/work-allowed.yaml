title:
  es: El trabajo que tu estatus permite
  en: Work your status allows
  ht: Travay estati ou pèmèt
summary:
  es: Trabaja solo si tu estatus lo permite. La respuesta está en las fechas de tu permiso de trabajo o en la oficina internacional de tu escuela.
  en: Work only if your status allows it. The answer is on your work card's dates, or at your school's international office.
  ht: Travay sèlman si estati ou pèmèt li. Repons lan sou dat ki sou pèmi travay ou, oswa nan biwo entènasyonal lekòl ou.
body:
  es: |-
    Un permiso de trabajo, la tarjeta EAD, muestra una fecha de inicio, una de fin y una categoría. Trabajar fuera de esas fechas no está autorizado.

    Consulta con la oficina acreditada si tu permiso de trabajo todavía es válido.

    Estudiantes F-1: el trabajo en el campus, CPT (entrenamiento práctico curricular) y OPT (entrenamiento práctico opcional) pasan por la oficina internacional de tu escuela. El DSO (oficial escolar designado) puede explicarte las reglas antes de empezar.

    Esta tarjeta termina aquí. No explica otras formas de cobrar.

    Las preguntas sobre tu propio caso van a un abogado o representante acreditado.
  en: |-
    A work permit, the EAD card, shows a start date, an end date, and a category. Work outside those dates is not authorized.

    Check whether your work card is still valid with the accredited desk.

    F-1 students: on-campus work, CPT (Curricular Practical Training), and OPT (Optional Practical Training) go through your school's international office. The DSO (Designated School Official) can explain the rules before you start.

    This card stops here. It does not explain other ways to get paid.

    Questions about your own case go to a lawyer or accredited representative.
  ht: |-
    Yon pèmi travay, kat EAD la, montre yon dat kòmansman, yon dat fen, ak yon kategori. Travay andeyò dat sa yo pa otorize.

    Tcheke ak biwo akredite a si pèmi travay ou toujou valab.

    Etidyan F-1: travay sou kanpis, CPT (fòmasyon pratik nan kourikoulòm) ak OPT (fòmasyon pratik opsyonèl) pase nan biwo entènasyonal lekòl ou. DSO a (ofisyèl lekòl ki deziyen) ka esplike règ yo anvan ou kòmanse.

    Kat sa a kanpe la. Li pa esplike lòt fason pou touche.

    Kesyon sou pwòp dosye ou ale bay yon avoka oswa yon reprezantan akredite.
