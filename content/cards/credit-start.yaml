title:
  es: El crédito empieza vacío
  en: Credit starts empty
  ht: Kredi kòmanse vid
summary:
  es: No tener historial de crédito aquí se ve como riesgo. Empieza poco a poco con una tarjeta asegurada. Nunca seas fiador de un desconocido.
  en: No US credit file reads as risk. Start small with a secured card. Never co-sign for a stranger.
  ht: Pa gen dosye kredi isit la vle di risk. Kòmanse piti ak yon kat kredi garanti. Pa janm siyen kòm garan pou yon moun ou pa konnen.
body:
  es: |-
    El crédito de otro país normalmente no pasa aquí. Empiezas sin historial, y los prestamistas lo ven como riesgo.

    Una tarjeta asegurada usa tu propio depósito como límite. Pagarla a tiempo construye historial.

    Lo que cuesta: el fiador debe toda la deuda si la otra persona no paga. Nunca por un desconocido. Nunca por un familiar que no te enseña la cuenta.
  en: |-
    Credit from another country usually does not carry over. You start with no file, and lenders treat that as risk.

    A secured card uses your own deposit as the limit. Paying it on time builds a record.

    What it costs: a co-signer owes the whole debt if the other person does not pay. Never for a stranger. Never for a relative who will not show you the bill.
  ht: |-
    Kredi lòt peyi anjeneral pa transfere. Ou kòmanse san dosye, epi moun k ap prete lajan wè sa kòm yon risk.

    Yon kat garanti sèvi ak pwòp depo ou kòm limit. Peye l alè bati yon dosye.

    Sa sa koute: garan an dwe tout dèt la si lòt moun nan pa peye. Pa janm pou yon moun ou pa konnen. Pa janm pou yon fanmi ki pa vle montre w bòdwo a.
