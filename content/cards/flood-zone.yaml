title:
  es: La zona de inundación de tu dirección
  en: "Your address's flood zone"
  ht: Zòn inondasyon adrès ou
summary:
  es: 'Consulta la zona de tu pin: una zona de peligro mínimo no significa riesgo cero, y el seguro contra inundaciones va aparte.'
  en: 'Check the zone for your pin: minimal hazard does not mean zero risk, and flood insurance is separate.'
  ht: 'Tcheke zòn pin ou a: danje minim pa vle di pa gen risk, epi asirans inondasyon separe.'
body:
  es: |-
    Para el pin de tu dirección, la zona que aparece es {fact:us.fema.flood-zone}. Esa clasificación indica peligro mínimo, no riesgo cero.

    El seguro contra inundaciones es separado del seguro de la vivienda. Pregunta al escritorio del NFIP qué cobertura corresponde a tu dirección.
  en: |-
    For your address pin, the zone shown is {fact:us.fema.flood-zone}. That classification means minimal hazard, not zero risk.

    Flood insurance is separate from home insurance. Ask the NFIP desk what coverage applies to your address.
  ht: |-
    Pou pin adrès ou a, zòn ki parèt la se {fact:us.fema.flood-zone}. Klasifikasyon sa a vle di danje minim, pa zewo risk.

    Asirans inondasyon separe ak asirans kay. Mande biwo NFIP la ki pwoteksyon ki mache pou adrès ou.
