title:
  es: Multa por cámara del bus escolar
  en: School-bus camera ticket
  ht: Tikè kamera bis lekòl
summary:
  es: Cómo leer un aviso de la cámara del bus escolar. Algunos se suspendieron después de multas equivocadas.
  en: How to read a school-bus camera notice. Some of these were suspended after bad tickets.
  ht: Kijan pou li yon avi kamera bis lekòl. Yo te sispann kèk ladan yo apre move tikè.
body:
  es: |-
    Florida permite a los distritos escolares usar cámaras en los buses para multar a quien pasa un bus detenido.

    Miami-Dade suspendió algunas de estas multas después de encontrar errores.

    Lee el aviso: quién lo manda, el lugar, el enlace de la foto o video, y cómo impugnarlo. Respeta la fecha límite que trae.

    No podemos buscar tu multa.
  en: |-
    Florida lets school districts use cameras on buses to ticket drivers who pass a stopped bus.

    Miami-Dade suspended some of these tickets after errors were found.

    Read the notice: who sent it, the place, the photo or video link, and how to contest it. Keep to the deadline printed on it.

    We cannot look up your citation.
  ht: |-
    Florid pèmèt distri lekòl yo mete kamera sou bis pou bay chofè ki pase yon bis ki kanpe tikè.

    Miami-Dade te sispann kèk nan tikè sa yo apre yo te jwenn erè.

    Li avi a: kiyès ki voye l, kote a, lyen foto oswa videyo a, ak kijan pou konteste l. Respekte dat limit ki ekri sou li a.

    Nou pa ka chèche tikè ou.
