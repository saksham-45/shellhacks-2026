body:
  es: |-
    Tu gobierno para esta dirección: {fact:us-fl-miamidade.gov.municipality}.

    Recogida del condado: basura {fact:us-fl-miamidade.trash.garbage-days}. Reciclaje {fact:us-fl-miamidade.trash.recycling-day}, semana {fact:us-fl-miamidade.trash.recycling-week}.

    En la Ciudad de Miami, la ciudad recoge: {fact:us-fl-miami.trash.day}. Leemos la lista de códigos de la ciudad, nunca adivinamos.

    ¿No pasaron? Repórtalo a la línea para lo que no es emergencia de tu gobierno.

    La noche antes de la recogida, esto pasa a ser lo primero en tu pantalla.
  en: |-
    Your government for this pin: {fact:us-fl-miamidade.gov.municipality}.

    County pickup: garbage {fact:us-fl-miamidade.trash.garbage-days}. Recycling {fact:us-fl-miamidade.trash.recycling-day}, week {fact:us-fl-miamidade.trash.recycling-week}.

    In the City of Miami, the city hauls: {fact:us-fl-miami.trash.day}. We read the city's own code list, never a guess.

    Missed pickup? File it with the non-emergency desk for your government.

    The night before pickup, this becomes the first thing on your screen.
  ht: |-
    Gouvènman ou pou adrès sa a: {fact:us-fl-miamidade.gov.municipality}.

    Ranmasaj konte a: fatra {fact:us-fl-miamidade.trash.garbage-days}. Resiklaj {fact:us-fl-miamidade.trash.recycling-day}, semèn {fact:us-fl-miamidade.trash.recycling-week}.

    Nan Vil Miami, se vil la ki ranmase: {fact:us-fl-miami.trash.day}. Nou li pwòp lis kòd vil la, nou pa janm devine.

    Yo pa t pase? Rapòte l bay liy pou sa ki pa ijans gouvènman ou.

    Aswè anvan ranmasaj la, sa a vin premye bagay sou ekran ou.
