  section: Origin lens > Etiquette cards
  item: Trash day is a rule with a fine. The night before is the hero for a settled household.
title:
  es: El día de la basura es una regla
  en: Trash day is a rule
  ht: Jou fatra se yon règ
summary:
  es: Los botes salen la noche antes y se entran después de la recogida. El día o el lugar equivocado puede traer una multa.
  en: Carts go out the night before and come back after pickup. The wrong day or the wrong place can bring a fine.
  ht: Bokit yo sòti aswè anvan an epi yo rantre apre ranmasaj la. Move jou oswa move plas ka pote yon amand.
body:
  es: |-
    Tu gobierno para esta dirección: {fact:us-fl-miamidade.gov.municipality}.

    Reglas del condado sobre cuándo y dónde sacar los botes: {fact:us-fl-miamidade.trash.cart-rules}.

    En la Ciudad de Miami, se aplican las reglas de la ciudad: {fact:us-fl-miami.trash.cart-rules}.
  en: |-
    Your government for this pin: {fact:us-fl-miamidade.gov.municipality}.

    County rules on when and where carts go out: {fact:us-fl-miamidade.trash.cart-rules}.

    In the City of Miami, the city's own rules apply: {fact:us-fl-miami.trash.cart-rules}.
  ht: |-
    Gouvènman ou pou adrès sa a: {fact:us-fl-miamidade.gov.municipality}.

    Règ konte a sou ki lè ak ki kote pou mete bokit yo deyò: {fact:us-fl-miamidade.trash.cart-rules}.

    Nan Vil Miami, se règ vil la ki aplike: {fact:us-fl-miami.trash.cart-rules}.
