title:
  es: Tu dirección de correo
  en: Your mail address
  ht: Adrès lapòs ou
summary:
  es: USCIS escribe por correo. Una carta que nadie abre puede acabar con un caso.
  en: USCIS writes by mail. A letter nobody opens can end a case.
  ht: USCIS ekri pa lapòs. Yon lèt pèsonn pa louvri ka fini yon dosye.
body:
  es: |-
    USCIS manda citas, pedidos de pruebas y decisiones por correo.

    Cuando te mudes, avísale a USCIS dentro de {fact:us.uscis.address-change-deadline}.

    La casa de un primo sirve solo si alguien allí abre tus cartas y te avisa el mismo día.

    Lo que cuesta: una carta de cita que no viste puede ser una cita perdida, y el caso puede ser negado.
  en: |-
    USCIS sends appointments, requests for evidence, and decisions by mail.

    When you move, tell USCIS within {fact:us.uscis.address-change-deadline}.

    A cousin's house works only if someone there opens your letters and tells you the same day.

    What it costs: a missed appointment letter can mean a missed appointment, and the case can be denied.
  ht: |-
    USCIS voye randevou, demann prèv, ak desizyon pa lapòs.

    Lè ou demenaje, di USCIS nan {fact:us.uscis.address-change-deadline}.

    Kay yon kouzen bon sèlman si yon moun la louvri lèt ou yo epi li di w menm jou a.

    Sa sa koute: yon lèt randevou ou pa wè ka vle di yon randevou ou rate, epi yo ka refize dosye a.
