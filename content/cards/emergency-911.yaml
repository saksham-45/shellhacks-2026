summary:
  es: Para policía, bomberos o ambulancia, ahora mismo. Funciona desde cualquier teléfono.
  en: For police, fire, or an ambulance, right now. It works from any phone.
  ht: Pou lapolis, ponpye, oswa yon anbilans, kounye a menm. Li mache sou nenpòt telefòn.
body:
  es: |-
    {fact:us.911.phone} es para un peligro ahora: un incendio, un choque, un delito, alguien que no puede respirar.

    Di primero dónde estás. Luego di qué pasó.

    Pide un intérprete si lo necesitas. Di el nombre de tu idioma en inglés.
  en: |-
    {fact:us.911.phone} is for danger now: a fire, a crash, a crime, someone who cannot breathe.

    Say where you are first. Then say what happened.

    Ask for an interpreter if you need one. Say the name of your language in English.
  ht: |-
    {fact:us.911.phone} se pou yon danje kounye a: yon dife, yon aksidan, yon krim, yon moun ki pa ka respire.

    Di ki kote ou ye an premye. Apre sa, di sa k pase.

    Mande yon entèprèt si ou bezwen. Di non lang ou an anglè.
