summary:
  es: Sticker contra placa, en los pórticos de tu ruta, por los días que manejas.
  en: Sticker versus plate, for the gantries on your drive, times the days you drive.
  ht: Sticker kont plak, pou pòtik ki sou wout ou, fwa jou ou kondwi yo.
body:
  es: |-
    Tu ruta: {fact:us-fl-miamidade.gmx.tolls-on-route}.

    {fact:us-fl-miamidade.gmx.sr836-97th.name}: {fact:us-fl-miamidade.gmx.sr836-97th.sunpass} con sticker, {fact:us-fl-miamidade.gmx.sr836-97th.plate} por placa.

    {fact:us-fl-miamidade.gmx.sr924-57th.name}: {fact:us-fl-miamidade.gmx.sr924-57th.sunpass} con sticker, {fact:us-fl-miamidade.gmx.sr924-57th.plate} por placa.

    {fact:us-fl-miamidade.gmx.sr112-32nd.name}: {fact:us-fl-miamidade.gmx.sr112-32nd.sunpass} con sticker, {fact:us-fl-miamidade.gmx.sr112-32nd.plate} por placa.

    {fact:us-fl-miamidade.gmx.sr836-137th.name}: {fact:us-fl-miamidade.gmx.sr836-137th.sunpass} con sticker, {fact:us-fl-miamidade.gmx.sr836-137th.plate} por placa.

    En todos los pórticos de la tabla de autopistas del condado, pagar por placa cuesta más que con SunPass.

    Los carriles express de la I-95 cambian de precio durante el día y necesitan transpondedor.
  en: |-
    Your drive: {fact:us-fl-miamidade.gmx.tolls-on-route}.

    {fact:us-fl-miamidade.gmx.sr836-97th.name}: {fact:us-fl-miamidade.gmx.sr836-97th.sunpass} with a sticker, {fact:us-fl-miamidade.gmx.sr836-97th.plate} by plate.

    {fact:us-fl-miamidade.gmx.sr924-57th.name}: {fact:us-fl-miamidade.gmx.sr924-57th.sunpass} with a sticker, {fact:us-fl-miamidade.gmx.sr924-57th.plate} by plate.

    {fact:us-fl-miamidade.gmx.sr112-32nd.name}: {fact:us-fl-miamidade.gmx.sr112-32nd.sunpass} with a sticker, {fact:us-fl-miamidade.gmx.sr112-32nd.plate} by plate.

    {fact:us-fl-miamidade.gmx.sr836-137th.name}: {fact:us-fl-miamidade.gmx.sr836-137th.sunpass} with a sticker, {fact:us-fl-miamidade.gmx.sr836-137th.plate} by plate.

    On every gantry in the county expressway table, paying by plate costs more than paying with SunPass.

    I-95 express lanes change price through the day and need a transponder.
  ht: |-
    Wout ou: {fact:us-fl-miamidade.gmx.tolls-on-route}.

    {fact:us-fl-miamidade.gmx.sr836-97th.name}: {fact:us-fl-miamidade.gmx.sr836-97th.sunpass} ak sticker, {fact:us-fl-miamidade.gmx.sr836-97th.plate} pa plak.

    {fact:us-fl-miamidade.gmx.sr924-57th.name}: {fact:us-fl-miamidade.gmx.sr924-57th.sunpass} ak sticker, {fact:us-fl-miamidade.gmx.sr924-57th.plate} pa plak.

    {fact:us-fl-miamidade.gmx.sr112-32nd.name}: {fact:us-fl-miamidade.gmx.sr112-32nd.sunpass} ak sticker, {fact:us-fl-miamidade.gmx.sr112-32nd.plate} pa plak.

    {fact:us-fl-miamidade.gmx.sr836-137th.name}: {fact:us-fl-miamidade.gmx.sr836-137th.sunpass} ak sticker, {fact:us-fl-miamidade.gmx.sr836-137th.plate} pa plak.

    Sou tout pòtik ki nan tablo otowout konte a, peye pa plak koute plis pase peye ak SunPass.

    Liy express I-95 yo chanje pri pandan jounen an epi yo bezwen yon transponde.
