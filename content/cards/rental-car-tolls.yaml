title:
  es: Peajes con carro de alquiler
  en: Rental car tolls
  ht: Peyaj ak machin lwaye
summary:
  es: Muchas vías aquí no tienen casetas de efectivo. La factura de peajes del carro de alquiler llega después del viaje, muchas veces con la comisión de la compañía.
  en: Many roads here have no cash booths. The toll bill for a rental car arrives after the trip, often with the company's fee on top.
  ht: Anpil wout isit la pa gen kote pou peye kach. Bòdwo peyaj machin lwaye a rive apre vwayaj la, souvan ak frè konpayi an sou li.
body:
  es: |-
    Los peajes aquí se pagan con transpondedor o con una foto de la placa.

    Pagar por placa cuesta más que con el sticker, en todos los pórticos de la tabla de autopistas del condado.

    Las compañías de alquiler te cobran los peajes después del viaje y pueden sumar una comisión por día o por peaje.

    Pregunta en el mostrador: cómo cobran los peajes y cuál es la comisión.
  en: |-
    Tolls here are paid by transponder or by a photo of the plate.

    Paying by plate costs more than the sticker rate, on every gantry in the county expressway table.

    Rental companies charge you the tolls after the trip and may add a fee per day or per toll.

    Ask at the counter: how are tolls billed, and what is the fee?
  ht: |-
    Isit la, yo peye peyaj ak yon transponde oswa ak yon foto plak la.

    Peye pa plak koute plis pase ak sticker, sou tout pòtik ki nan tablo otowout konte a.

    Konpayi lwaye yo fè w peye peyaj yo apre vwayaj la epi yo ka mete yon frè pa jou oswa pa peyaj.

    Mande nan kontwa a: kijan yo fè w peye peyaj yo, epi konbyen frè a ye?
