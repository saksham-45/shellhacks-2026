  section: Origin lens > Etiquette cards
  item: “How are you?” is a greeting, not a request for the truth.
title:
  es: “How are you?” es un saludo
  en: “How are you?” is a greeting
  ht: “How are you?” se yon bonjou
summary:
  es: Quiere decir hola. Contesta “Good, and you?” y sigue.
  en: It means hello. Answer “Good, and you?” and keep going.
  ht: Li vle di bonjou. Reponn “Good, and you?” epi kontinye.
body:
  es: |-
    En tu país, la pregunta puede ser una invitación a contar cómo estás de verdad.

    Aquí, el cajero o el empleado solo está saludando. Una respuesta corta es lo educado.

    Guarda la respuesta de verdad para tu médico o tus amigos.
  en: |-
    At home, the question may be an invitation to tell how you really are.

    Here, a cashier or clerk is saying hello. A short answer is polite.

    Save the real answer for your doctor or your friends.
  ht: |-
    Lakay, kesyon an ka yon envitasyon pou w rakonte kijan ou ye vre.

    Isit la, kesye a oswa anplwaye a ap di w bonjou sèlman. Yon repons kout se politès.

    Kenbe vrè repons lan pou doktè ou oswa zanmi ou.
