title:
  es: Las reglas de manejo que aquí se cumplen
  en: Driving rules that are enforced here
  ht: Règ kondwi yo aplike isit la
summary:
  es: Puedes llegar siendo buen chofer y aun así ser peligroso aquí. Estas son las reglas que más cuestan.
  en: You can arrive a good driver and still be dangerous here. These are the rules that cost the most.
  ht: Ou ka rive yon bon chofè epi ou toujou danjere isit la. Men règ ki koute plis yo.
body:
  es: |-
    Aquí se maneja por la derecha.

    Un bus escolar con la señal de pare afuera: para, vengas de donde vengas, en una calle sin separador.

    Derecha en rojo: para por completo primero, luego gira, salvo que una señal lo prohíba.

    En un pare de todas las direcciones, pasa primero el que paró primero. Es una regla, no una negociación.

    Manejar bajo los efectos del alcohol es un delito, no una multa.

    Nunca le pagues a un policía. Ofrecer dinero es soborno, un delito. El seguro es obligatorio.
  en: |-
    We drive on the right.

    A school bus with its stop sign out: stop, from either direction, on a road with no median.

    Right on red: stop fully first, then turn, unless a sign says no.

    At an all-way stop, the first car to stop goes first. It is a rule, not a negotiation.

    Driving under the influence is a crime, not a ticket.

    Never pay an officer. Offering money is bribery, a crime. Insurance is required.
  ht: |-
    Isit la, nou kondwi sou bò dwat.

    Yon bis lekòl ak siy stop li deyò: kanpe, kèlkeswa bò ou soti, sou yon wout ki pa gen separasyon nan mitan.

    Vire adwat sou limyè wouj: kanpe nèt anvan, epi vire, sòf si yon siy di non.

    Nan yon stop tout direksyon, premye machin ki kanpe a pase anvan. Se yon règ, se pa yon negosyasyon.

    Kondwi sou efè alkòl se yon krim, se pa yon tikè.

    Pa janm peye yon polis. Ofri lajan se koripsyon, se yon krim. Asirans obligatwa.
