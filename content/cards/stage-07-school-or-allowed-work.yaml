body:
  es: |-
    Lo principal es la zona escolar, el DSO, el funcionario escolar que maneja tu registro estudiantil, o las fechas del permiso de trabajo.

    Lo principal es la primera tarjeta de esa lista que aún no terminas. Cada familiar puede estar en una etapa distinta en la misma casa.
  en: |-
    The hero is the school zone, the DSO, the school official who handles your student record, or the dates on the work card.

    The hero is the first card on that list you have not finished. Family members can be on different stages in the same house.
  ht: |-
    Premye bagay la se zòn lekòl la, DSO a, ofisyèl lekòl ki okipe dosye etidyan ou a, oswa dat ki sou pèmi travay la.

    Premye bagay la se premye kat nan lis sa a ou poko fini. Chak moun nan fanmi an ka nan yon etap diferan nan menm kay la.
