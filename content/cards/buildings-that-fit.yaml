summary:
  es: 'Una lista corta de edificios con límite de ingresos para lo que ganas, cada uno con teléfono. Llámalos: esto es la coincidencia de ingresos, no un apartamento libre.'
  en: 'A short list of income-restricted buildings for this income, each with a phone. Call them: this is the income match, not an open unit.'
  ht: 'Yon ti lis bilding ki gen limit revni pou sa w touche, chak ak yon telefòn. Rele yo: sa se matche revni, se pa yon apatman ki lib.'
body:
  es: |-
    Edificios para tus ingresos: {fact:us-fl-miamidade.housing.matching-buildings}.

    La lista sale del buscador de vivienda asequible de Florida. Para la casa de demostración es una lista revisada a mano, marcada como demo.

    No vemos apartamentos libres. Llama y pregunta si la lista de espera está abierta.
  en: |-
    Buildings for your income: {fact:us-fl-miamidade.housing.matching-buildings}.

    The list comes from Florida's affordable-housing search. For the demo household it is a hand-checked set, labeled demo.

    We do not see vacancies. Call and ask whether the waitlist is open.
  ht: |-
    Bilding pou revni ou: {fact:us-fl-miamidade.housing.matching-buildings}.

    Lis la soti nan motè rechèch lojman abòdab Florid la. Pou kay demonstrasyon an, se yon lis yo verifye alamen, ki make demo.

    Nou pa wè apatman ki lib. Rele epi mande si lis datant lan louvri.
