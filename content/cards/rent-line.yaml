title:
  es: Tu línea de renta
  en: Your rent line
  ht: Liy lwaye ou
summary:
  es: El tamaño y los ingresos de tu casa frente a los límites oficiales del lugar donde de verdad está tu dirección. Por debajo o por encima de la línea, con la fuente abajo.
  en: Your household size and income against the official limits for where your pin actually is. Under the line or over it, with the source underneath.
  ht: Kantite moun ak revni kay ou konpare ak limit ofisyèl kote adrès ou ye vre. Anba liy lan oswa anwo l, ak sous la anba.
body:
  es: |-
    Tu dirección está en {fact:us-fl-miamidade.gov.municipality}. Una línea solo cuenta dentro del gobierno que la publicó.

    La línea del Condado Miami-Dade para tu casa: {fact:us-fl-miamidade.housing.household-vs-limit}. Límite de renta de programas del condado para dos cuartos: {fact:us-fl-miamidade.housing.rent-limit-2br-60}.

    En la Ciudad de Miami, también se aplica la tabla de la ciudad: {fact:us-fl-miami.housing.household-vs-limit}. Ejemplos de esa tabla de la ciudad: {fact:us-fl-miami.housing.income-limit-1p-50}; {fact:us-fl-miami.housing.income-limit-4p-50}.

    Estas líneas son para programas con límite de ingresos, no la renta de un anuncio. Estar por debajo no quiere decir que un edificio acepte tu solicitud.

    Si una tabla no tiene fuente, lo decimos y te damos la oficina de vivienda del condado.
  en: |-
    Your pin is in {fact:us-fl-miamidade.gov.municipality}. A line only counts inside the government that published it.

    Miami-Dade County's line for your household: {fact:us-fl-miamidade.housing.household-vs-limit}. County program rent limit for a two-bedroom: {fact:us-fl-miamidade.housing.rent-limit-2br-60}.

    In the City of Miami, the city's own table also applies: {fact:us-fl-miami.housing.household-vs-limit}. Examples from that city table: {fact:us-fl-miami.housing.income-limit-1p-50}; {fact:us-fl-miami.housing.income-limit-4p-50}.

    These lines are for income-restricted programs, not the rent on a listing. Being under the line does not mean a building will take your application.

    If a table is unsourced, we say so and name the county housing desk.
  ht: |-
    Adrès ou nan {fact:us-fl-miamidade.gov.municipality}. Yon liy konte sèlman anndan gouvènman ki pibliye l la.

    Liy Konte Miami-Dade pou kay ou: {fact:us-fl-miamidade.housing.household-vs-limit}. Limit lwaye pwogram konte a pou de chanm: {fact:us-fl-miamidade.housing.rent-limit-2br-60}.

    Nan Vil Miami, tablo vil la aplike tou: {fact:us-fl-miami.housing.household-vs-limit}. Egzanp nan tablo vil sa a: {fact:us-fl-miami.housing.income-limit-1p-50}; {fact:us-fl-miami.housing.income-limit-4p-50}.

    Liy sa yo se pou pwogram ki gen limit revni, se pa lwaye ki sou yon anons. Lè w anba liy lan, sa pa vle di yon bilding ap aksepte aplikasyon ou.

    Si yon tablo pa gen sous, nou di l epi nou ba w biwo lojman konte a.
