title:
  es: Rango de la cuenta de luz
  en: Power bill range
  ht: Konbyen kouran ka koute
summary:
  es: 'Lo que vecinos de Kendall dijeron pagar, no tu medidor. Y lo que sí ayuda: el termostato y el sol en las ventanas.'
  en: 'What neighbors in Kendall reported paying, not your meter. Plus the moves that matter: the thermostat and sun on the windows.'
  ht: 'Sa vwazen Kendall yo di yo te peye, se pa kontè pa w. Plis sa ki fè diferans: tèmosta a ak solèy sou fenèt yo.'
body:
  es: |-
    Los vecinos dijeron: {fact:us-fl-miamidade.power.neighbor-reports-kendall}. Son reportes de vecinos, con el mes que cubren, no este medidor.

    Tu cuenta real está en tu propia cuenta de la compañía de luz. No es pública, así que no la podemos ver.

    Sube un poco el termostato, y tapa el sol directo en las ventanas por la tarde.

    Si FPL te pide un depósito, es de {fact:us-fl.fpl.deposit-months} de uso eléctrico esperado. Se devuelve después de {fact:us-fl.fpl.deposit-refund-months} de servicio consecutivo si cumples las condiciones de pago.

    El programa LIHEAP del condado tiene reglas sobre quién en el hogar califica para la ayuda de la cuenta de luz. Pregunta al escritorio de Community Services; no adivines si calificas.
  en: |-
    Neighbors reported: {fact:us-fl-miamidade.power.neighbor-reports-kendall}. These are neighbor reports, with the month they cover, not this meter.

    Your real bill is in your own utility account. It is not public, so we cannot see it.

    Set the thermostat a little higher, and block direct sun on the windows in the afternoon.

    If FPL asks for a deposit, it is {fact:us-fl.fpl.deposit-months} of expected electric use. It is refunded after {fact:us-fl.fpl.deposit-refund-months} of consecutive service if you meet the payment conditions.

    The county LIHEAP program has rules on who in the household qualifies for light-bill help. Ask the Community Services desk; do not guess whether you qualify.
  ht: |-
    Vwazen yo di: {fact:us-fl-miamidade.power.neighbor-reports-kendall}. Se rapò vwazen, ak mwa yo kouvri a, se pa kontè sa a.

    Vrè bòdwo ou nan pwòp kont ou nan konpayi kouran an. Li pa piblik, kidonk nou pa ka wè l.

    Monte tèmosta a yon ti kras, epi bloke solèy dirèk sou fenèt yo nan apremidi.

    Si FPL mande yon depo, se {fact:us-fl.fpl.deposit-months} itilizasyon kouran yo prevwa. Yo remèt li apre {fact:us-fl.fpl.deposit-refund-months} sèvis youn apre lòt si ou ranpli kondisyon peman yo.

    Pwogram LIHEAP konte a gen règ sou kiyès nan kay la ki kalifye pou èd sou bòdwo kouran. Mande biwo Community Services la; pa devine si ou kalifye.
