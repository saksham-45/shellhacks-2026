title:
  es: Camino a la escuela
  en: School run
  ht: Mennen timoun lekòl
summary:
  es: Tu escuela de zona, su teléfono y sus grados, y si el distrito te debe un bus.
  en: Your zoned school, its phone and grades, and whether the district owes you a bus.
  ht: Lekòl zòn ou, telefòn li ak klas li yo, epi si distri a dwe ba w yon bis.
body:
  es: |-
    Primaria de zona: {fact:us-fl-miamidade.school.zoned-elementary}, {fact:us-fl-miamidade.school.zoned-elementary-address}. Teléfono: {fact:us-fl-miamidade.school.zoned-elementary-phone}. Grados: {fact:us-fl-miamidade.school.zoned-elementary-grades}.

    Secundaria: {fact:us-fl-miamidade.school.zoned-middle}. Preparatoria: {fact:us-fl-miamidade.school.zoned-high}.

    De la casa a la escuela: {fact:us-fl-miamidade.school.distance-to-zoned}. Dentro de {fact:us-fl-miamidade.m-dcps.bus-distance}, el distrito no te debe bus. Fuera de eso, tu parada está en el portal de padres, no aquí.

    Escuelas de elección y magnet: el padre o la madre maneja.

    Si usas transporte público para ir a la escuela, la tarifa con descuento con la tarjeta EASY es {fact:us-fl-miamidade.transit.fare.discounted}; pregunta antes de pagar la tarifa completa.
  en: |-
    Zoned elementary: {fact:us-fl-miamidade.school.zoned-elementary}, {fact:us-fl-miamidade.school.zoned-elementary-address}. Phone: {fact:us-fl-miamidade.school.zoned-elementary-phone}. Grades: {fact:us-fl-miamidade.school.zoned-elementary-grades}.

    Middle: {fact:us-fl-miamidade.school.zoned-middle}. High: {fact:us-fl-miamidade.school.zoned-high}.

    From home to the school: {fact:us-fl-miamidade.school.distance-to-zoned}. Inside {fact:us-fl-miamidade.m-dcps.bus-distance}, the district does not owe a bus. Outside it, your stop is in the parent portal, not here.

    Choice and magnet schools: the parent drives.

    If you use transit to get to school, the discounted fare with the EASY Card is {fact:us-fl-miamidade.transit.fare.discounted}; ask before paying full fare.
  ht: |-
    Lekòl primè zòn nan: {fact:us-fl-miamidade.school.zoned-elementary}, {fact:us-fl-miamidade.school.zoned-elementary-address}. Telefòn: {fact:us-fl-miamidade.school.zoned-elementary-phone}. Klas: {fact:us-fl-miamidade.school.zoned-elementary-grades}.

    Mwayen: {fact:us-fl-miamidade.school.zoned-middle}. Segondè: {fact:us-fl-miamidade.school.zoned-high}.

    Soti lakay rive lekòl la: {fact:us-fl-miamidade.school.distance-to-zoned}. Anndan {fact:us-fl-miamidade.m-dcps.bus-distance}, distri a pa dwe ba w bis. Andeyò sa, arè ou nan pòtay paran an, pa isit la.

    Lekòl chwa ak magnet: se paran an ki kondwi.

    Si ou itilize transpò piblik pou ale lekòl, pri rabè a ak kat EASY la se {fact:us-fl-miamidade.transit.fare.discounted}; mande anvan ou peye tout pri a.
