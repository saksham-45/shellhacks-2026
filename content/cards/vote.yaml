title:
  es: Dónde votar y quién te representa
  en: Where to vote, who represents you
  ht: Ki kote pou vote, kiyès ki reprezante w
summary:
  es: Tu lugar de votación, votación anticipada y tus distritos, del mapa del condado.
  en: Your polling place, early voting, and your districts, from the county's map.
  ht: Biwo vòt ou, vòt davans, ak distri ou yo, dapre kat konte a.
body:
  es: |-
    Lugar de votación: {fact:us-fl-miamidade.vote.polling-place}. Votación anticipada: {fact:us-fl-miamidade.vote.early-voting}.

    Distrito de la comisión del condado: {fact:us-fl-miamidade.vote.commission-district}. Congreso: {fact:us-fl-miamidade.vote.congress-district}. Senado estatal: {fact:us-fl-miamidade.vote.state-senate-district}. Cámara estatal: {fact:us-fl-miamidade.vote.state-house-district}.

    Cualquiera puede ver quién lo representa y contactar esa oficina.

    Solo los ciudadanos de Estados Unidos pueden votar en elecciones federales y estatales. Inscribirse o votar sin ser ciudadano es un delito y puede acabar con un caso de inmigración.
  en: |-
    Polling place: {fact:us-fl-miamidade.vote.polling-place}. Early voting: {fact:us-fl-miamidade.vote.early-voting}.

    County commission district: {fact:us-fl-miamidade.vote.commission-district}. Congress: {fact:us-fl-miamidade.vote.congress-district}. State Senate: {fact:us-fl-miamidade.vote.state-senate-district}. State House: {fact:us-fl-miamidade.vote.state-house-district}.

    Anyone can look up who represents them and contact that office.

    Only US citizens may vote in federal and state elections. Registering or voting as a non-citizen is a crime and can end an immigration case.
  ht: |-
    Biwo vòt: {fact:us-fl-miamidade.vote.polling-place}. Vòt davans: {fact:us-fl-miamidade.vote.early-voting}.

    Distri komisyon konte a: {fact:us-fl-miamidade.vote.commission-district}. Kongrè: {fact:us-fl-miamidade.vote.congress-district}. Sena leta: {fact:us-fl-miamidade.vote.state-senate-district}. Chanm leta: {fact:us-fl-miamidade.vote.state-house-district}.

    Nenpòt moun ka chèche kiyès ki reprezante l epi kontakte biwo sa a.

    Se sèlman sitwayen ameriken ki ka vote nan eleksyon federal ak eleksyon leta. Enskri oswa vote lè ou pa sitwayen se yon krim epi li ka fini yon dosye imigrasyon.
