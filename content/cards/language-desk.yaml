title:
  es: Alguien que hable tu idioma
  en: Someone who speaks your language
  ht: Yon moun ki pale lang ou
summary:
  es: Una persona de confianza y una oficina que conteste en tu idioma. Para papeles, solo un abogado o un representante acreditado.
  en: One person you trust, and a desk that answers in your language. For papers, only a lawyer or an accredited representative.
  ht: Yon moun ou fè konfyans, ak yon biwo ki reponn nan lang ou. Pou papye, se sèlman yon avoka oswa yon reprezantan akredite.
body:
  es: |-
    La línea de ayuda comunitaria te conecta con ayuda local y puede usar un intérprete.

    Para papeles de inmigración, solo un abogado con licencia o un representante acreditado por el Departamento de Justicia puede aconsejarte.

    El amigo de un familiar en un estacionamiento no es esa oficina, aunque sea amable.
  en: |-
    The community help line connects you to local help, and can bring in an interpreter.

    For immigration papers, only a licensed lawyer or a DOJ-accredited representative may advise you.

    A relative's friend in a parking lot is not that desk, even if they are kind.
  ht: |-
    Liy èd kominotè a konekte w ak èd lokal, epi li ka mete yon entèprèt sou liy lan.

    Pou papye imigrasyon, se sèlman yon avoka ki gen lisans oswa yon reprezantan Depatman Jistis akredite ki ka konseye w.

    Zanmi yon fanmi nan yon pakin pa biwo sa a, menm si li janti.
