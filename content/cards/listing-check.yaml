summary:
  es: Una lista de sí o no, en voz alta, antes de pagar cualquier cosa por un lugar.
  en: A yes-or-no list, spoken, before you pay anything for a place.
  ht: Yon lis wi oswa non, a vwa wo, anvan ou peye anyen pou yon kote.
body:
  es: |-
    ¿Quieren dinero antes de que hayas entrado?

    ¿Piden transferencia, criptomonedas, bitcoin o tarjeta de regalo?

    ¿Dicen “estoy en el extranjero” y no pueden enseñarlo?

    ¿Hay una cuota que no aparece en la página del propio edificio?

    Cualquier sí es una estafa conocida. Para y denúncialo.
  en: |-
    Do they want money before you have been inside?

    Do they ask for a wire, crypto, bitcoin, or a gift card?

    Do they say “I am abroad” and cannot show it?

    Is there a fee that is not on the building's own website?

    Any yes is a known scam pattern. Stop and report it.
  ht: |-
    Èske yo vle lajan anvan ou antre ladan l?

    Èske yo mande w voye lajan, kripto, bitcoin, oswa yon kat kado?

    Èske yo di “m aletranje” epi yo pa ka montre l?

    Èske gen yon frè ki pa sou pwòp sit entènèt bilding lan?

    Nenpòt wi se yon eskwokri yo konnen. Kanpe epi rapòte l.
