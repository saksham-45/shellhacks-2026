title:
  es: Impuestos, incluso el primer año
  en: Taxes, even in year one
  ht: Taks, menm premye ane a
summary:
  es: Puedes deber impuestos desde el primer año aquí. La fecha del IRS no espera a un primo.
  en: Taxes can be due the first year you are here. The IRS deadline does not wait for a cousin.
  ht: Ou ka dwe taks depi premye ane ou isit la. Dat limit IRS la p ap tann yon kouzen.
body:
  es: |-
    La fecha límite anual para declarar impuestos federales es {fact:us.irs.filing-deadline}.

    Quién debe declarar depende de los ingresos y de las reglas de residencia. Lo decide el IRS, no el preparador.

    Hay ayuda gratis con los impuestos en programas de voluntarios del IRS.

    Lo que cuesta: declarar tarde puede traer multas e intereses.

    No preparamos declaraciones ni escogemos tu forma de declarar.
  en: |-
    The yearly federal filing deadline is {fact:us.irs.filing-deadline}.

    Who must file depends on income and residency rules. The IRS decides, not the preparer.

    Free tax help exists through IRS volunteer programs.

    What it costs: filing late can bring penalties and interest.

    We do not prepare returns or pick a filing status.
  ht: |-
    Dat limit chak ane pou fè deklarasyon taks federal se {fact:us.irs.filing-deadline}.

    Kiyès ki dwe fè deklarasyon depann de revni ak règ rezidans. Se IRS ki deside, pa moun k ap prepare taks la.

    Gen èd gratis pou taks nan pwogram volontè IRS yo.

    Sa sa koute: si ou fè deklarasyon an an reta, ou ka peye penalite ak enterè.

    Nou pa prepare deklarasyon ni chwazi estati deklarasyon ou.
