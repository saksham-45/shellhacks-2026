title:
  es: Las vacunas de la escuela
  en: School shots
  ht: Vaksen lekòl
summary:
  es: Las escuelas de Estados Unidos piden el récord de vacunas del niño. El estado decide cuáles.
  en: US schools ask for a child's vaccine record. The state decides which shots.
  ht: Lekòl Etazini mande kat vaksen timoun nan. Se leta ki deside ki vaksen.
body:
  es: |-
    Cada estado fija las vacunas que un niño necesita para la escuela.

    En Florida, un médico o el departamento de salud llena el formulario de vacunas escolares del estado.

    Lleva la tarjeta de vacunas de tu país. Una clínica puede pasarla al formulario del estado.
  en: |-
    Each state sets the vaccines a child needs for school.

    In Florida, a doctor or the health department fills in the state's own school vaccine form.

    Bring the vaccine card from home. A clinic can copy it onto the state form.
  ht: |-
    Chak eta fikse vaksen yon timoun bezwen pou lekòl.

    Nan Florid, yon doktè oswa depatman sante a ranpli fòm vaksen lekòl leta a.

    Pote kat vaksen ou te genyen lakay. Yon klinik ka kopye l sou fòm leta a.
