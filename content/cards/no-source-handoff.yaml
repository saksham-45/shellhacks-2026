title:
  es: Esto no lo tenemos
  en: We do not have this one
  ht: Nou pa genyen sa a
summary:
  es: Cuando no tenemos fuente, o la fuente no responde, te decimos cuál de las dos, y te pasamos la oficina que sabe.
  en: When we have no source, or the source is down, we say which one, and hand you the desk that knows.
  ht: Lè nou pa gen sous, oswa sous la pa reponn, nou di w kiyès nan de a, epi nou ba w biwo ki konnen an.
body:
  es: |-
    Sin fuente quiere decir que todavía no hay una fuente oficial para esto. No vamos a adivinar.

    No disponible quiere decir que la fuente existe pero no respondió ahora. Intenta más tarde o pregunta en la oficina.

    Una cláusula rara del contrato: asistencia legal. Tus propios papeles: un abogado o representante acreditado. Lo demás: la línea de ayuda comunitaria.
  en: |-
    Unsourced means no official source exists for this yet. We will not guess.

    Unavailable means the source exists but did not answer just now. Try again later, or ask the desk.

    A strange lease clause: legal aid. Your own papers: a lawyer or accredited representative. Anything else: the community help line.
  ht: |-
    San sous vle di poko gen yon sous ofisyèl pou sa. Nou p ap devine.

    Pa disponib vle di sous la egziste men li pa reponn kounye a. Eseye pita, oswa mande biwo a.

    Yon kloz dwòl nan kontra lwaye: èd legal. Pwòp papye ou: yon avoka oswa yon reprezantan akredite. Tout lòt bagay: liy èd kominotè a.
