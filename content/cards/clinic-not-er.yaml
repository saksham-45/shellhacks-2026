title:
  es: Una clínica, no la sala de emergencias, para una fiebre
  en: A clinic, not the ER, for a fever
  ht: Yon klinik, pa sal ijans, pou yon lafyèv
summary:
  es: La sala de emergencias tiene que atenderte. La cuenta llega después. Para enfermedades comunes, empieza en una clínica.
  en: The emergency room must see you. The bill comes later. For ordinary sickness, start at a clinic.
  ht: Sal ijans lan oblije wè w. Bòdwo a vini apre. Pou maladi òdinè, kòmanse nan yon klinik.
body:
  es: |-
    Las salas de emergencias deben evaluar y estabilizar a cualquiera con una emergencia, pueda pagar o no.

    Lo que cuesta: la cuenta de emergencias llega después y casi siempre es mucho más alta que una visita a la clínica.

    Los centros de salud con calificación federal cobran según tus ingresos. Los proveedores de salud que reciben dinero federal deben tomar medidas razonables para darte acceso real en tu idioma.

    Dolor de pecho, dificultad para respirar, sangrado fuerte: llama al {fact:us.911.phone}. Para eso es la sala de emergencias.
  en: |-
    Emergency rooms must screen and stabilize anyone with an emergency, whether or not they can pay.

    What it costs: the ER bill arrives later and is usually far higher than a clinic visit.

    Federally qualified health centers charge on a sliding scale by income. Health providers that take federal money must take reasonable steps to give you meaningful access in your language.

    Chest pain, trouble breathing, heavy bleeding: call {fact:us.911.phone}. That is what the ER is for.
  ht: |-
    Sal ijans yo oblije egzamine epi estabilize nenpòt moun ki nan yon ijans, kit li ka peye kit li pa kapab.

    Sa sa koute: bòdwo sal ijans lan vini apre epi anjeneral li pi chè anpil pase yon vizit nan klinik.

    Sant sante federal kalifye yo fè w peye dapre sa w touche. Founisè swen sante ki resevwa lajan federal dwe pran mezi rezonab pou ba ou aksè toutbon nan lang ou.

    Doulè nan pwatrin, pwoblèm pou respire, anpil san k ap koule: rele {fact:us.911.phone}. Se pou sa sal ijans lan la.
