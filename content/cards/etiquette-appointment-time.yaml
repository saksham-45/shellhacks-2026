  section: Origin lens > Etiquette cards
  item: 'Time: the appointment is the time, not the hour after.'
title:
  es: La cita es a la hora
  en: The appointment is the time
  ht: Randevou a se lè a
summary:
  es: Llega antes de la hora de la carta. Llegar tarde puede costarte el turno y empezar de nuevo.
  en: Arrive before the time on the letter. Late can mean you lose the slot and start over.
  ht: Rive anvan lè ki sou lèt la. An reta ka fè w pèdi plas ou epi rekòmanse.
body:
  es: |-
    En tu país, la hora de una cita puede ser aproximada.

    Aquí, las oficinas toman la hora en serio. La fila de seguridad y el estacionamiento toman tiempo extra.

    Lo que cuesta: perder el turno puede significar esperar una nueva cita.
  en: |-
    At home, the time on an appointment may be a rough guide.

    Here, offices treat the time as the time. Security lines and parking take extra.

    What it costs: a missed slot can mean waiting for a new appointment.
  ht: |-
    Lakay, lè ki sou yon randevou ka sèvi kòm yon gid ki pa egzak.

    Isit la, biwo yo pran lè a oserye. Liy sekirite ak pakin pran tan anplis.

    Sa sa koute: si ou rate plas ou, ou ka oblije tann yon nouvo randevou.
