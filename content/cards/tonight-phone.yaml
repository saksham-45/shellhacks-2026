  item: 2. A phone that can reach home
title:
  es: Un teléfono que llegue a casa
  en: A phone that reaches home
  ht: Yon telefòn ki ka rele lakay
summary:
  es: Al comienzo, WhatsApp importa más que el correo. Consigue una SIM o eSIM que no pida número de Seguro Social.
  en: At the start, WhatsApp matters more than email. Get a SIM or eSIM that does not ask for a Social Security number.
  ht: Nan kòmansman an, WhatsApp pi enpòtan pase imèl. Pran yon SIM oswa eSIM ki pa mande nimewo Sekirite Sosyal.
body:
  es: |-
    Los planes prepagados se venden sin número de Seguro Social. Por lo general basta el pasaporte.

    Antes de salir de la tienda, manda un WhatsApp a tu casa.

    Anota también en papel el número de un familiar y el de una oficina de ayuda, por si el teléfono se apaga.

    No comparamos precios de compañías. Pide el total con impuestos antes de pagar.
  en: |-
    Prepaid plans are sold without a Social Security number. A passport is usually enough.

    Before you leave the store, send a WhatsApp message home.

    Write a relative's number and a help desk's number on paper too, in case the phone dies.

    We do not compare carrier prices. Ask for the total with taxes before you pay.
  ht: |-
    Yo vann plan peye davans san nimewo Sekirite Sosyal. Anjeneral, paspò a ase.

    Anvan ou soti nan magazen an, voye yon mesaj WhatsApp lakay.

    Ekri nimewo yon fanmi ak nimewo yon biwo èd sou papye tou, si telefòn nan ta mouri.

    Nou pa konpare pri konpayi yo. Mande total la ak taks anvan ou peye.
