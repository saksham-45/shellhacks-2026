  section: Batch 3
  item: Medicare and noncitizen relatives
title:
  es: Medicare para un familiar mayor
  en: Medicare for an older relative
  ht: Medicare pou yon fanmi ki pi gran
summary:
  es: Las reglas de Medicare dependen del grupo migratorio de la persona y de si ya estaba inscrita.
  en: Medicare rules depend on the person's immigration group and whether they were already enrolled.
  ht: Règ Medicare yo depann de gwoup imigrasyon moun nan ak si moun nan te deja enskri.
body:
  es: |-
    Para una persona que no es ciudadana, la elegibilidad o inscripción de Medicare se limita a estos grupos: {fact:us.medicare.noncitizen.eligible-groups}.

    Si la persona ya tenía Medicare cuando se aprobó la regla, la limitación para quienes ya estaban inscritos comienza {fact:us.medicare.noncitizen.existing-enrollee-rule}.

    No adivines qué significa esto para tu familiar. Reúne sus avisos y papeles, llama al Seguro Social y pide que revisen el caso.
  en: |-
    For a person who is not a citizen, Medicare eligibility or enrollment is limited to these groups: {fact:us.medicare.noncitizen.eligible-groups}.

    If the person already had Medicare when the rule was enacted, the limit for people already enrolled begins {fact:us.medicare.noncitizen.existing-enrollee-rule}.

    Do not guess what this means for your relative. Gather their notices and papers, call Social Security, and ask them to review the case.
  ht: |-
    Pou yon moun ki pa sitwayen, kalifikasyon oswa enskripsyon Medicare limite ak gwoup sa yo: {fact:us.medicare.noncitizen.eligible-groups}.

    Si moun nan te deja gen Medicare lè yo te adopte règ la, limit pou moun ki te deja enskri yo kòmanse {fact:us.medicare.noncitizen.existing-enrollee-rule}.

    Pa devine sa sa vle di pou fanmi ou. Rasanble avi ak papye li yo, rele Sekirite Sosyal, epi mande yo revize ka a.
