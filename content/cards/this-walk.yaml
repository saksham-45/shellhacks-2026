body:
  es: |-
    Parada más cercana: {fact:us-fl-miamidade.transit.nearest-stop}.

    En Miami-Dade, en el último año completo publicado, {fact:us-fl-miamidade.pedestrian.hit-latest-year} peatones fueron atropellados y {fact:us-fl-miamidade.pedestrian.killed-latest-year} murieron.

    No podemos mostrar choques en esta esquina.

    Cruza en el semáforo. De noche, ponte algo claro. No des por hecho que el chofer que dobla te ve.
  en: |-
    Nearest stop: {fact:us-fl-miamidade.transit.nearest-stop}.

    In Miami-Dade, in the latest full year published, {fact:us-fl-miamidade.pedestrian.hit-latest-year} pedestrians were hit and {fact:us-fl-miamidade.pedestrian.killed-latest-year} were killed.

    We cannot show crashes at this corner.

    Cross at a signal. At night, wear something light. Do not assume a turning driver sees you.
  ht: |-
    Arè ki pi pre a: {fact:us-fl-miamidade.transit.nearest-stop}.

    Nan Miami-Dade, nan dènye ane konplè ki pibliye a, machin frape {fact:us-fl-miamidade.pedestrian.hit-latest-year} moun a pye epi {fact:us-fl-miamidade.pedestrian.killed-latest-year} mouri.

    Nou pa ka montre aksidan nan kwen sa a.

    Travèse nan limyè a. Lannwit, mete yon rad klè. Pa kwè chofè k ap vire a wè w.
