summary:
  es: Compara la comisión y la tasa de cambio antes de enviar. La compañía tiene que mostrarte las dos.
  en: Compare the fee and the exchange rate before you send. The company must show you both.
  ht: Konpare frè a ak to chanj lan anvan ou voye. Konpayi an oblije montre w toude.
body:
  es: |-
    Antes de pagar, la compañía de envíos debe mostrarte la comisión, la tasa de cambio y cuánto llega.

    Después de pagar, normalmente tienes un tiempo corto para cancelar: {fact:us.cfpb.remittance-cancel-window}.

    Compara lo que llega, no solo la comisión.

    Nunca mandes dinero a alguien que te promete papeles, un trabajo o un apartamento a cambio.
  en: |-
    Before you pay, a money-transfer company must show the fee, the exchange rate, and the amount that arrives.

    After paying, you usually have a short window to cancel: {fact:us.cfpb.remittance-cancel-window}.

    Compare the amount that arrives, not only the fee.

    Never send money to someone who promises papers, a job, or an apartment in return.
  ht: |-
    Anvan ou peye, konpayi transfè lajan an dwe montre w frè a, to chanj lan, ak konbyen k ap rive.

    Apre ou fin peye, anjeneral ou gen yon ti tan pou anile: {fact:us.cfpb.remittance-cancel-window}.

    Konpare konbyen k ap rive, pa sèlman frè a.

    Pa janm voye lajan bay yon moun ki pwomèt ou papye, yon travay, oswa yon apatman an echanj.
