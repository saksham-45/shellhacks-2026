summary:
  es: Pasaporte, I-94, todo lo que te dio USCIS, actas de nacimiento, récord de vacunas. Toma foto de cada página. Quédate con los originales.
  en: Passport, I-94, anything USCIS gave you, birth certificates, vaccine records. Photograph every page. Keep the originals.
  ht: Paspò, I-94, tout sa USCIS ba ou, batistè, kat vaksen. Pran foto chak paj. Kenbe orijinal yo.
body:
  es: |-
    El I-94 es tu registro de llegada. Lo puedes buscar e imprimir en el sitio oficial de CBP.

    Toma foto de cada página, por delante y por detrás. Las fotos se quedan en este teléfono.

    No le entregues los originales a nadie que ofrezca guardarlos o hacerte los papeles.

    Esta carpeta es tuya. Nunca aparece en la tarjeta de otro familiar.
  en: |-
    The I-94 is your arrival record. You can look it up and print it on the official CBP website.

    Photograph every page, front and back. The photos stay on this phone.

    Do not hand originals to anyone who offers to keep them safe or to do the papers for you.

    This folder is yours. It never shows on another family member's card.
  ht: |-
    I-94 la se dosye arive ou. Ou ka chèche l epi enprime l sou sit ofisyèl CBP a.

    Pran foto chak paj, devan ak dèyè. Foto yo rete nan telefòn sa a.

    Pa bay orijinal yo bay okenn moun ki ofri kenbe yo pou ou oswa fè papye yo pou ou.

    Katab sa a se pou ou. Li pa janm parèt sou kat yon lòt moun nan fanmi an.
