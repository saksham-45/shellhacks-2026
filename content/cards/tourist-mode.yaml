body:
  es: |-
    Este modo muestra solo lo que necesita un visitante.

    ¿Te mudaste? Di “soy residente” y se abre el camino completo.
  en: |-
    This mode shows only what a visitor needs.

    Moved here? Say “I am a resident” and the full path opens.
  ht: |-
    Mòd sa a montre sèlman sa yon vizitè bezwen.

    Ou demenaje isit? Di “mwen se rezidan” epi tout chemen an ap louvri.
