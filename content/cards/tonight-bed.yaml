  item: 1. A bed that is real
title:
  es: Una cama de verdad esta noche
  en: A real bed tonight
  ht: Yon kabann tout bon aswè a
summary:
  es: Duerme donde ya entraste. Nunca mandes dinero por un lugar que no has visto.
  en: Sleep where you have stood inside. Never send money for a place you have not seen.
  ht: Dòmi kote ou te deja antre. Pa janm voye lajan pou yon kote ou poko wè.
body:
  es: |-
    En tu país, la palabra de un primo sobre un cuarto muchas veces bastaba.

    Aquí, una estafa común pide una transferencia, una tarjeta de regalo o criptomonedas antes de que veas el lugar.

    Lo que cuesta: el dinero casi siempre se pierde, y sigues sin cama.

    ¿No tienes un lugar seguro esta noche? Llama a la línea de ayuda comunitaria y pide un refugio que reciba gente hoy.
  en: |-
    At home, a cousin's word about a room was often enough.

    Here, a common scam asks for a wire, a gift card, or crypto before you see the place.

    What it costs: the money is usually gone, and you still have no bed.

    No safe place tonight? Call the community help line and ask for a shelter that does intake.
  ht: |-
    Lakay, pawòl yon kouzen sou yon chanm te konn sifi.

    Isit la, yon eskwokri ki komen mande w voye lajan, yon kat kado, oswa kripto anvan ou wè kote a.

    Sa sa koute: lajan an prèske toujou pèdi, epi ou toujou pa gen kabann.

    Ou pa gen yon kote ki an sekirite aswè a? Rele liy èd kominotè a epi mande yon abri k ap resevwa moun.
