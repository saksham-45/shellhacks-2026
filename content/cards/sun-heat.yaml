title:
  es: Sol y calor
  en: Sun and heat
  ht: Solèy ak chalè
summary:
  es: El sol aquí quema rápido y el calor puede enfermarte. Agua, sombra y protector solar son parte del plan.
  en: The sun here burns fast and the heat can make you sick. Water, shade, and sunscreen are part of the plan.
  ht: Solèy isit la boule vit epi chalè a ka rann ou malad. Dlo, lonbraj, ak krèm solèy fè pati plan an.
body:
  es: |-
    Señales de enfermedad por calor: mareo, mucho sudor, confusión. Busca sombra y toma agua.

    Confusión o desmayo por el calor es una emergencia: llama al {fact:us.911.phone}.

    Nunca dejes a un niño o una mascota en un carro estacionado, ni por un minuto.
  en: |-
    Heat illness signs: dizziness, heavy sweating, confusion. Get to shade and drink water.

    Confusion or fainting in the heat is an emergency: call {fact:us.911.phone}.

    Never leave a child or a pet in a parked car, not even for a minute.
  ht: |-
    Siy maladi chalè: tèt vire, anpil swe, konfizyon. Al nan lonbraj epi bwè dlo.

    Konfizyon oswa endispozisyon nan chalè se yon ijans: rele {fact:us.911.phone}.

    Pa janm kite yon timoun oswa yon bèt nan yon machin ki pake, pa menm pou yon ti moman.
