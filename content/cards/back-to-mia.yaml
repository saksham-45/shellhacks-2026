title:
  es: Volver a MIA
  en: Getting back to MIA
  ht: Retounen nan ayewopò MIA
summary:
  es: Taxi oficial, app de viaje o el tren. Deja tiempo para el tráfico y la seguridad.
  en: Official taxi, rideshare, or the train. Leave time for traffic and security.
  ht: Taksi ofisyèl, aplikasyon woulib, oswa tren an. Kite tan pou trafik ak sekirite.
body:
  es: |-
    Metrorail tiene parada en la estación del Aeropuerto Internacional de Miami.

    Los taxis y las apps dejan en salidas.

    Mira en la app de tu aerolínea con cuánta anticipación llegar.

    ¿Carro de alquiler? Devuélvelo primero. Los cargos de peaje pueden llegar después.
  en: |-
    Metrorail stops at the Miami International Airport station.

    Taxis and rideshare drop off at departures.

    Check your airline's app for how early to be there.

    Rental car? Return it first. The toll charges can come later.
  ht: |-
    Metrorail kanpe nan estasyon Ayewopò Entènasyonal Miami an.

    Taksi ak aplikasyon woulib yo depoze moun nan depa.

    Gade nan aplikasyon konpayi avyon ou konbyen tan davans pou w la.

    Machin lwaye? Remèt li an premye. Frè peyaj yo ka vini apre.
