summary:
  es: La línea de ayuda comunitaria, una clínica, asistencia legal y un refugio que recibe gente. Te damos la oficina. No diagnosticamos.
  en: The community help line, a clinic, legal aid, and a shelter that does intake. We hand you the desk. We do not diagnose.
  ht: Liy èd kominotè a, yon klinik, èd legal, ak yon abri k ap resevwa moun. Nou ba w biwo a. Nou pa fè dyagnostik.
body:
  es: |-
    La línea de ayuda comunitaria te conecta con comida, refugio y ayuda con cuentas cerca de ti.

    Línea para personas sin hogar en Miami-Dade: {fact:us-fl-miamidade.homeless-trust.phone}.

    Clínica: los centros de salud comunitarios cobran según tus ingresos.

    Asistencia legal en Miami-Dade: {fact:us-fl-miamidade.legal-aid.phone}.

    Esta tarjeta no da consejo legal de inmigración. Para papeles, abre la tarjeta de papeles de inmigración.
  en: |-
    The community help line connects you to food, shelter, and help with bills near you.

    Homeless helpline in Miami-Dade: {fact:us-fl-miamidade.homeless-trust.phone}.

    Clinic: community health centers charge by income.

    Legal aid in Miami-Dade: {fact:us-fl-miamidade.legal-aid.phone}.

    This card gives no immigration legal advice. For papers, open the immigration papers card.
  ht: |-
    Liy èd kominotè a konekte w ak manje, abri, ak èd pou bòdwo toupre w.

    Liy pou moun ki san kay nan Miami-Dade: {fact:us-fl-miamidade.homeless-trust.phone}.

    Klinik: sant sante kominotè yo fè w peye dapre revni ou.

    Èd legal nan Miami-Dade: {fact:us-fl-miamidade.legal-aid.phone}.

    Kat sa a pa bay konsèy legal sou imigrasyon. Pou papye, louvri kat papye imigrasyon an.
