summary:
  es: Basura grande, mosquitos, recogida perdida, un bache, un bote roto. La solicitud correcta, en tu idioma, al gobierno correcto.
  en: Bulky trash, mosquitoes, a missed pickup, a pothole, a broken cart. The right request, in your language, to the right government.
  ht: Gwo fatra, moustik, ranmasaj yo rate, yon twou nan wout, yon bokit kase. Bon demann lan, nan lang ou, bay bon gouvènman an.
body:
  es: |-
    La línea del condado para lo que no es emergencia: {fact:us-fl-miamidade.311.phone}. Idiomas: {fact:us-fl-miamidade.311.languages}.

    Tu gobierno para esta dirección: {fact:us-fl-miamidade.gov.municipality}. Lo que es solo de la ciudad va a esa ciudad.

    En la Ciudad de Miami, los servicios de la ciudad tienen su propia línea: {fact:us-fl-miami.311.phone}.

    Haz la solicitud en la app o el sitio del condado. Nosotros no la hacemos por ti.

    Solicitudes pasadas cerca de tu dirección: {fact:us-fl-miamidade.311.history-near-pin}. El condado marca estos datos como beta, y casi todo el trabajo solo de la ciudad no aparece.
  en: |-
    Miami-Dade's non-emergency line: {fact:us-fl-miamidade.311.phone}. Languages: {fact:us-fl-miamidade.311.languages}.

    Your government for this pin: {fact:us-fl-miamidade.gov.municipality}. City-only requests go to that city.

    In the City of Miami, city services have their own request line: {fact:us-fl-miami.311.phone}.

    File the request in the county's own app or website. We do not file for you.

    Past requests near your pin: {fact:us-fl-miamidade.311.history-near-pin}. The county marks this data as beta, and most city-only work is missing.
  ht: |-
    Liy Miami-Dade pou sa ki pa ijans: {fact:us-fl-miamidade.311.phone}. Lang: {fact:us-fl-miamidade.311.languages}.

    Gouvènman ou pou adrès sa a: {fact:us-fl-miamidade.gov.municipality}. Demann ki pou vil la sèlman ale bay vil sa a.

    Nan Vil Miami, sèvis vil la gen pwòp liy demann yo: {fact:us-fl-miami.311.phone}.

    Fè demann lan nan aplikasyon oswa sit konte a. Nou pa fè l pou ou.

    Ansyen demann toupre adrès ou: {fact:us-fl-miamidade.311.history-near-pin}. Konte a make done sa yo beta, epi pifò travay ki pou vil sèlman pa ladan yo.
