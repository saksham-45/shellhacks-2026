# Origin lens (myAD Content). The file id is the ADCore OriginLens case.
# title is the lens name; lens_card plus attaches_to are the cards it surfaces.
id: questionnaire
origin_lens: questionnaire
status: draft
plan_refs:
- plan: myamericandream-plan.md
  section: Origin lens
  item: Other countries start as a short questionnaire
title:
  es: Cuéntanos cómo era en tu país
  en: Tell us how it worked at home
  ht: Di nou kijan sa te ye lakay
summary:
  es: Para los países que aún no hemos escrito. Comparamos solo lo que nos cuentas sobre policía, manejo, médicos y renta, para que una costumbre de allá no te tome por sorpresa.
  en: For countries we have not written yet. We compare only what you tell us about police, driving, doctors, and rent, so a habit from home does not catch you by surprise.
  ht: Pou peyi nou poko ekri yo. Nou konpare sèlman sa ou di nou sou lapolis, kondwi, doktè, ak lwaye, pou yon abitid lakay pa pran w pa sipriz.
translation_status:
  es: draft
  ht: draft
needs_review:
  es: true
  en: false
  ht: true
desk: us.211
origin_match:
  self_select: true
  note: Fallback for any origin with no written lens; answers stay on the phone.
modes:
- resident
lens_card: lens-origin-questionnaire
attaches_to:
- driving-rules
