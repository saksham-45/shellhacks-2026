summary:
  es: 'Lo que sorprende a los visitantes: la propina es parte del precio, la factura del peaje llega después del viaje y el sol quema rápido. Pasarlos por alto cuesta dinero o un día.'
  en: 'What catches visitors: the tip is part of the price, the toll bill arrives after the trip, and the sun burns fast. Missing any of them costs money or a day.'
  ht: 'Sa ki sezi vizitè yo: poubwa a fè pati pri a, bòdwo peyaj la rive apre vwayaj la, epi solèy la boule vit. Si ou bliye youn, sa koute lajan oswa yon jounen.'
