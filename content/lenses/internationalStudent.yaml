  item: International students
title:
  es: Aquí para estudiar
  en: Here to study
  ht: Isit la pou etidye
summary:
  es: La oficina internacional de tu escuela es tu oficina de ayuda. El trabajo, los cambios de dirección y tu licencia pasan por ella, y saltártela puede poner en riesgo tu estatus de estudiante.
  en: Your school's international office is your desk. Work, address changes, and your license run through it, and skipping it can put your student status at risk.
  ht: Biwo entènasyonal lekòl ou a se biwo pa w. Travay, chanjman adrès, ak lisans ou pase pa li, e si ou sote l sa ka mete estati etidyan ou an danje.
