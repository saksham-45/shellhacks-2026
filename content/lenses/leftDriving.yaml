title:
  es: Aprendiste a manejar por la izquierda
  en: Learned to drive on the left
  ht: Ou aprann kondwi sou bò gòch
summary:
  es: Un buen conductor en su país puede ser un peligro aquí. Cambian el lado de la vía, los giros y los papeles, y el primer error suele ser un choque o una multa.
  en: A good driver at home can still be a danger here. The side of the road, the turns, and the paperwork change, and the first mistake is often a crash or a ticket.
  ht: Yon bon chofè lakay ka toujou yon danje isit la. Bò wout la, vire yo, ak papye yo chanje, e premye erè a souvan se yon aksidan oswa yon tikè.
