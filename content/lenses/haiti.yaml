summary:
  es: Primero el criollo haitiano, y cada plazo verificado. El correo en inglés y las fechas que se oyen de otros son como la gente pierde una fecha límite.
  en: Creole first, and every deadline checked. Mail in English and dates heard secondhand are how people miss a deadline.
  ht: Kreyòl an premye, ak chak delè verifye. Lèt an anglè ak dat ou tande nan bouch lòt moun se konsa moun rate yon delè.
