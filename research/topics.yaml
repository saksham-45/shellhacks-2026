# Controlled vocabulary for the optional `topics` tags on ledger facts. Owner: myAD Research.
# Shared by Content, Regions, Agents and the Lead's bundle builder. validate.py fails on any
# fact topic that is not listed here. Ids are stable once written: add new ids, never rename
# or reuse one. Keep the list small; tag by user intent, not by agency.
topics:
  - id: trash
    slug: trash
    description: Garbage, recycling and bulky-trash pickup days and rules for a pin.
  - id: municipality
    slug: municipality
    description: Whether a pin is in an incorporated city or unincorporated county, which decides who handles trash, permits and police.
  - id: schools
    slug: schools
    description: Zoned public schools, enrollment papers and school contacts.
