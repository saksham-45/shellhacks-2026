name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Secrets, strings, tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python3 -m pip install -r tools/requirements.txt
      - name: Tool tests
        run: python3 -m pytest -q -c tools/pytest.ini --rootdir tools tools/tests
      - name: No secrets in the tree
        run: python3 tools/check_no_secrets.py
      - name: String parity (en / es / ht)
        run: python3 tools/check_string_parity.py --root .
      - name: Fact coverage
        run: python3 tools/check_fact_coverage.py --root .

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m pip install -e "server[dev]"
      - name: Pytest
        working-directory: server
        run: python3 -m pytest -q

  ios:
    name: iOS build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build
        env:
          GEMINI_API_KEY: ""
          ELEVENLABS_API_KEY: ""
        working-directory: ios
        run: |
          xcodebuild -scheme MyAmericanDream \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build
