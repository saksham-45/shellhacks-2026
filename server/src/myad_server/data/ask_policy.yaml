# /v1/ask deterministic policy (owner: myAD Agents).
#
# DESK-ONLY CLASSIFIER (review r3, finding B1). Questions only a desk can answer are never answered by a card.
# Matching is structural, not phrase-based (see ask/desk_only.py):
#   * text is casefolded, accent-folded and punctuation-stripped, then tokenized;
#   * a token also matches with a plural, -ed, -d or -ing ending removed (entries are base forms and are
#     not stemmed: "renewed" never matches "renew"); an entry ending in `*` is a prefix
#     (>= 4 letters); two adjacent tokens also match one entry word ("rande-vou" = "randevou");
#   * multi-word entries match contiguous tokens. Write entries with accents or without; they are folded too.
# Every lexicon mixes es, en and ht on purpose: code-switched requests need no language detection.
# A rule fires when ALL lexicons of ANY one of its `when` clauses hit (a DOMAIN plus a QUESTION-TYPE cue, or
# a domain that is desk-only by itself). `ambiguous_domain`: the domain word alone is an ambiguous overlap and
# fails closed to the desk unless a card that is itself about that domain matches confidently.
# `unless_part_of`: tokens inside these phrases do not count for the rule ("work permit" is not a job ask).
# Rule order is the reason reported when several rules fire. The wording is a first pass by Agents;
# Language/Content should review it (Creole especially). Held-out eval: tests/data/desk_only_heldout.yaml.
