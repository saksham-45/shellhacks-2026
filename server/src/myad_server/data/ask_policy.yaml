desk_only:
  - id: visa_outcome
    immigration: true
    when:
      - [immigration_status, outcome_cue]
    ambiguous_domain: immigration_status
    topics: []
  - id: school_bus_eligibility
    # Agents never state school-bus eligibility; every school-bus question goes to the district's
    # transportation desk (agreed with Regions).
    when:
      - [school_bus]
      - [school, bus]
    topics: []
  - id: clinic_price
    when:
      - [medical, price_cue]
    ambiguous_domain: medical
    topics: []
  - id: appointment_slot
    when:
      - [appointment]
      - [booking_cue, bookable]
    topics: []
  - id: job
    when:
      - [employment]
    unless_part_of: [work_document]
    topics: []

# M4: the generic /v1/ask desk (no answer, or a desk-only question with no card desk) follows the household's
# resolved jurisdiction; unknown jurisdiction falls back to the county, and a city desk is used only when the
# jurisdiction is that city. `parents` and `levels` mirror server/regionpacks/*/manifest.json (checked by
# tests/test_ask_desk_choice.py). Desk ids are never listed here: a desk is `<pack>.<name>` for a name in
# `generic_desk_names`, used only if the ledger has its contact facts.
jurisdictions:
  parents:
    us: null
    us-fl: us
    us-fl-miamidade: us-fl
    us-fl-miami: us-fl-miamidade
  levels:
    us: country
    us-fl: state
    us-fl-miamidade: county
    us-fl-miami: city
  unknown: us-fl-miamidade
generic_desk_names:
  - "311"

# Cards carrying one of these topics count as immigration content. The research topic
# vocabulary does not carry an immigration marker, so this validated policy set is the source of truth.
immigration_topics:
  - immigration
  - tps
  - visa
  - asylum
  - uscis
  - status

# When a card offers one of these actions and the utterance uses the verb, the resolution performs that
# action instead of opening the card. Keys must exist in contracts/intent/command_keys.json.
action_verbs:
  call_desk: '\b(call|llamar|llama|llamo|rele|telefon|phone number|numero de telefono)'
  open_map: '\b(map|mapa|kat\b|directions|direcciones|como llego|how do i get there)'
