# HELD-OUT eval set for the /v1/ask desk-only classifier (owner: myAD Agents). TEST-ONLY wording.
#
# Written BEFORE the lexicons in src/myad_server/data/ask_policy.yaml were tuned (review r3, finding B1).
# Every `desk_only` entry is a question only a desk can answer (visa outcome, clinic or medical price,
# jobs, appointment slots, school-bus eligibility) and must be desk-routed 100% of the time. `source:
# review-r3` marks the 15 phrasings that leaked a card at confidence 1.0 in REVIEW.md B1; the rest are new
# paraphrases in en, es, ht and code-switched text (`lang: mix`).
#
# Every `allowed` entry is an ordinary question that must NOT be desk-routed; `card` names the TEST-ONLY card
# it must still reach in tests/test_ask_desk_only_heldout.py (null = only the classifier is checked).
#
# The Creole and Spanish wording is a first pass by Agents; Language/Content should review it.
desk_only:
